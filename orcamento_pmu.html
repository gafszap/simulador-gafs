<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Orçamento - PMU | GAFS</title>
  <style>
    :root {
      --gold: #f4d03f;
      --dark: #111;
      --gray-bg: #eef0f2;
      --border: #ddd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--gray-bg);
      font-family: Arial, Helvetica, sans-serif;
      color: #222;
      padding: 30px 16px;
    }
    .sheet {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      box-shadow: 0 4px 18px rgba(0,0,0,0.15);
      border-radius: 8px;
      overflow: hidden;
    }
    header.brand {
      background: var(--dark);
      color: #fff;
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    header.brand h1 {
      margin: 0;
      color: var(--gold);
      font-size: 26px;
      letter-spacing: 1px;
    }
    header.brand .doc-type {
      font-size: 13px;
      color: #ccc;
      margin-top: 4px;
    }
    header.brand .meta {
      text-align: right;
      font-size: 13px;
      color: #ddd;
    }
    .content { padding: 28px 32px; }
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 24px;
      margin-bottom: 24px;
    }
    .field label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: #888;
      margin-bottom: 4px;
    }
    .field input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px 10px;
      font-size: 14px;
      font-family: inherit;
      color: #222;
    }
    table.items {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    table.items th {
      background: #f7f7f7;
      text-align: left;
      font-size: 12px;
      text-transform: uppercase;
      color: #666;
      padding: 10px;
      border-bottom: 2px solid var(--border);
    }
    table.items td {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      vertical-align: top;
    }
    table.items input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 8px;
      font-family: inherit;
      font-size: 14px;
    }
    .qty-input { width: 60px; text-align: center; }
    .price-input { width: 100px; text-align: right; }
    .subtotal-cell { text-align: right; font-weight: bold; white-space: nowrap; }
    .totals {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 24px;
    }
    .totals table { border-collapse: collapse; }
    .totals td { padding: 6px 12px; font-size: 14px; }
    .totals .total-row td {
      font-size: 18px;
      font-weight: bold;
      color: var(--dark);
      border-top: 2px solid var(--dark);
    }
    .conditions {
      background: #fafafa;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px 20px;
      margin-bottom: 24px;
      font-size: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .conditions strong { color: #555; }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      padding: 0 32px 28px;
      flex-wrap: wrap;
    }
    .btn {
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-primary { background: #00c98d; color: #fff; }
    .btn-secondary { background: #fff; color: var(--dark); border: 1px solid var(--border); }
    .hint {
      font-size: 12px;
      color: #999;
      text-align: center;
      padding-bottom: 20px;
    }
    @media print {
      body { background: #fff; padding: 0; }
      .sheet { box-shadow: none; border-radius: 0; max-width: 100%; }
      .actions, .hint { display: none; }
      .field input, table.items input {
        border: none;
        padding: 2px 0;
      }
      header.brand { background: var(--dark) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <div class="sheet">
    <header class="brand">
      <div>
        <h1>GAFS</h1>
        <div class="doc-type">Comunicação Visual · Orçamento</div>
      </div>
      <div class="meta">
        Data: <span id="dataAtual"></span><br/>
        WhatsApp: (34) 3336-3486
      </div>
    </header>

    <div class="content">
      <div class="info-grid">
        <div class="field">
          <label>Cliente</label>
          <input type="text" id="cliente" value="PMU"/>
        </div>
        <div class="field">
          <label>Contato</label>
          <input type="text" id="contato" value="Roze"/>
        </div>
      </div>

      <table class="items">
        <thead>
          <tr>
            <th style="width:46%">Descrição</th>
            <th style="width:12%">Qtd.</th>
            <th style="width:18%">Valor Unit. (R$)</th>
            <th style="width:24%">Subtotal (R$)</th>
          </tr>
        </thead>
        <tbody id="itensBody"></tbody>
      </table>

      <div class="totals">
        <table>
          <tr class="total-row">
            <td>Total</td>
            <td id="totalGeral">R$ 0,00</td>
          </tr>
        </table>
      </div>

      <div class="conditions">
        <div><strong>Forma de entrega:</strong> Entrega própria</div>
        <div><strong>Prazo de entrega:</strong> 5 dias úteis</div>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" onclick="window.print()">🖨️ Imprimir / Salvar PDF</button>
      <button class="btn btn-secondary" onclick="copiarResumo()">📋 Copiar resumo p/ WhatsApp</button>
    </div>
    <div class="hint">Preencha os valores unitários para calcular o total automaticamente.</div>
  </div>

  <script>
    const itens = [
      { desc: 'Banner "Dia do Consumidor" - 1,20 x 0,90m', qtd: 1, valor: 0 },
      { desc: 'Suporte para banner - garra simples', qtd: 1, valor: 0 }
    ];

    function formatarMoeda(v) {
      return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function renderItens() {
      const tbody = document.getElementById('itensBody');
      tbody.innerHTML = '';
      itens.forEach((item, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.desc}</td>
          <td><input type="number" min="1" class="qty-input" value="${item.qtd}" onchange="atualizarItem(${i}, 'qtd', this.value)"/></td>
          <td><input type="number" min="0" step="0.01" class="price-input" value="${item.valor || ''}" placeholder="0,00" onchange="atualizarItem(${i}, 'valor', this.value)"/></td>
          <td class="subtotal-cell" id="subtotal-${i}">${formatarMoeda(item.qtd * item.valor)}</td>
        `;
        tbody.appendChild(tr);
      });
      atualizarTotal();
    }

    function atualizarItem(i, campo, valor) {
      itens[i][campo] = parseFloat(valor) || 0;
      document.getElementById(`subtotal-${i}`).textContent = formatarMoeda(itens[i].qtd * itens[i].valor);
      atualizarTotal();
    }

    function atualizarTotal() {
      const total = itens.reduce((soma, item) => soma + (item.qtd * item.valor), 0);
      document.getElementById('totalGeral').textContent = formatarMoeda(total);
    }

    function copiarResumo() {
      const cliente = document.getElementById('cliente').value;
      const contato = document.getElementById('contato').value;
      const total = itens.reduce((soma, item) => soma + (item.qtd * item.valor), 0);
      const linhas = itens.map(item => `- ${item.desc} | Qtd: ${item.qtd} | Unit: ${formatarMoeda(item.valor)} | Subtotal: ${formatarMoeda(item.qtd * item.valor)}`).join('\n');
      const texto = `*ORÇAMENTO GAFS*\nCliente: ${cliente}\nContato: ${contato}\nData: ${document.getElementById('dataAtual').textContent}\n\n${linhas}\n\n*Total: ${formatarMoeda(total)}*\n\nForma de entrega: Entrega própria\nPrazo de entrega: 5 dias úteis`;
      navigator.clipboard.writeText(texto).then(() => {
        alert('Resumo copiado! Agora é só colar no WhatsApp.');
      }).catch(() => {
        alert('Não foi possível copiar automaticamente. Selecione o texto manualmente.');
      });
    }

    document.getElementById('dataAtual').textContent = new Date().toLocaleDateString('pt-BR');
    renderItens();
  </script>
</body>
</html>
